services:
  postgres:
    image: postgres:18
    container_name: expense-tracker-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: expense_tracker
      POSTGRES_PASSWORD: expense_tracker_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_tracker -d expense_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Shared rate-limit counters. Valkey 8 = what Render Key Value runs in production.
  # Counters are short-lived, so persistence is off and no volume is needed. No password: dev only,
  # and the port is bound to localhost so the instance is not reachable from the network.
  redis:
    image: valkey/valkey:8-alpine
    container_name: expense-tracker-redis
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]

    ports:
      - "127.0.0.1:6379:6379"

    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # LOCAL DEVELOPMENT ONLY. Every value below is a dev placeholder, never a production secret.
  backend:
    build: ./backend
    image: expense-tracker-backend:local
    container_name: expense-tracker-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      # production mode = fail fast if any DB variable is missing (same checks as a real deploy)
      APP_ENV: production
      PORT: "8080"
      TZ: UTC
      DATABASE_URL: jdbc:postgresql://postgres:5432/expense_tracker
      DATABASE_USER: expense_tracker
      DATABASE_PASSWORD: expense_tracker_dev_password
      JWT_SECRET: local-dev-only-jwt-secret-do-not-use-in-production
      REDIS_URL: redis://redis:6379
      # No CLIENT_IP_HEADER: there is no proxy locally, so no header may be trusted.

    ports:
      - "8080:8080"

volumes:
  postgres_data: